name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew test --continue --stacktrace

      - name: Debug APK'ları derle
        run: ./gradlew assembleDebug --continue --stacktrace

      # İki APK aynı çalıştırmada derlendiği için aynı debug anahtarıyla imzalanır (Data Layer şartı).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: akis-debug-apks
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
